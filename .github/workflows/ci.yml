# Every job runs in the same Docker Compose services as local development, so CI and a
# developer's machine use the same PHP, extensions, and Playwright.
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker compose build app
      - run: docker compose run --rm app composer install --no-interaction --no-progress
      - name: composer check
        run: docker compose run --rm app composer check
      - name: composer test
        run: docker compose run --rm app composer test

  e2e:
    name: Playwright journeys
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker compose build app
      - run: docker compose run --rm app composer install --no-interaction --no-progress
      - run: docker compose --profile e2e up --exit-code-from e2e e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: tests/e2e/results/
          retention-days: 7

  upgrade:
    name: Upgrade from the last release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # The previous release is a tag somewhere in the history.
          fetch-depth: 0
      - run: docker compose build app
      - name: Upgrade test
        run: |
          previous="$(git describe --tags --abbrev=0 --match 'v*' HEAD^ 2>/dev/null || true)"
          if [ -z "$previous" ]; then
            echo "No earlier release tag, nothing to upgrade from."
            exit 0
          fi
          docker compose run --rm app tests/upgrade/run.sh "$previous" HEAD

  release:
    name: Release ZIP
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, e2e, upgrade]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - run: docker compose build app
      - run: docker compose run --rm app bin/build-release "$GITHUB_REF_NAME"
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The notes are the version's section of CHANGELOG.md, from its heading to the next one.
          awk -v version="${GITHUB_REF_NAME#v}" '/^## / { found = ($2 == version); next } found' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "CHANGELOG.md has no section for ${GITHUB_REF_NAME#v}." >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" build/show-of-hands-*.zip --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
