# Every job runs in the same Docker Compose services as local development, so CI and a
# developer's machine use the same PHP, extensions, and Playwright.
#
# Every merge to main is a version: a pull request adds its section at the top of CHANGELOG.md, and
# the push to main tags it and publishes the release. A tag the release job pushes with GITHUB_TOKEN
# starts no workflow, so nothing listens for tags.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to a pull request replaces its running checks. Pushes to main never cancel or skip
# each other: each one is a release.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changelog:
    name: Changelog entry
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # The previous version is a tag somewhere in the history.
          fetch-depth: 0
      - name: The pull request adds the next version at the top of CHANGELOG.md
        run: bin/changelog check "${{ github.event.pull_request.base.sha }}"

  check:
    name: Check and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker compose build app
      - run: docker compose run --rm app composer install --no-interaction --no-progress
      # A security advisory for any installed package, dev ones included, fails the build.
      - name: composer audit
        run: docker compose run --rm app composer audit
      - name: composer check
        run: docker compose run --rm app composer check
      - name: composer test
        run: docker compose run --rm app composer test

  e2e:
    name: Playwright journeys
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker compose build app
      - run: docker compose run --rm app composer install --no-interaction --no-progress
      - run: docker compose --profile e2e up --exit-code-from e2e e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: tests/e2e/results/
          retention-days: 7

  upgrade:
    name: Upgrade from the last release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # The previous release is a tag somewhere in the history.
          fetch-depth: 0
      - run: docker compose build app
      - name: Upgrade test
        run: |
          previous="$(git describe --tags --abbrev=0 --match 'v*' HEAD^ 2>/dev/null || true)"
          if [ -z "$previous" ]; then
            echo "No earlier release tag, nothing to upgrade from."
            exit 0
          fi
          docker compose run --rm app tests/upgrade/run.sh "$previous" HEAD

  release:
    name: Tag and release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, e2e, upgrade]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Tag the topmost version of CHANGELOG.md
        id: tag
        run: |
          tag="v$(bin/changelog top)"
          tagged="$(git rev-parse -q --verify "refs/tags/$tag^{commit}" || true)"
          if [ -n "$tagged" ] && [ "$tagged" != "$GITHUB_SHA" ]; then
            echo "::error::$tag exists already. Every change to main needs a new version at the top of CHANGELOG.md, through a pull request."
            exit 1
          fi
          bin/changelog notes "${tag#v}" > notes.md
          # Before the build, which names the ZIP after git describe. A re-run finds the tag on this commit.
          [ -n "$tagged" ] || git tag "$tag" "$GITHUB_SHA"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - run: docker compose build app
      - run: docker compose run --rm app bin/build-release "${{ steps.tag.outputs.tag }}"
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          # The tag goes out only with a ZIP to release, so a failed build leaves nothing to clean up.
          git push origin "refs/tags/$TAG"
          gh release create "$TAG" "build/show-of-hands-${TAG#v}.zip" --title "$TAG" --notes-file notes.md --verify-tag
