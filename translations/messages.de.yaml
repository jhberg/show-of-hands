login:
  lead: Melde dich mit deinem Google-Konto an, dem {brand}-Konto oder deinem privaten, wenn es hinterlegt ist. Abstimmen kann nur, wer in der Mitgliederliste steht.
  google: Mit Google anmelden
  google_other: Mit einem anderen Konto anmelden
  return_hint: Nach der Anmeldung geht es direkt zur Abstimmung.
  dev_login: Ohne Google anmelden (Entwicklung)
  unknown:
    title: Diese Adresse ist nicht als Mitglied hinterlegt.
    signed_in_as: Angemeldet mit
    hint: Bitte mit dem {brand}-Konto oder der bei der Verwaltung hinterlegten privaten Adresse anmelden.
  facts:
    one_vote: Eine Stimme pro Mitglied, geprüft über die E-Mail-Adresse.
    anonymous: Die Stimme selbst ist anonym und bis zum Abschluss änderbar. Wer schon abgestimmt hat, ist sichtbar.
    result: Das Ergebnis erscheint auf der Abstimmungsseite, sobald der Vorstand die Abstimmung abschließt.

error:
  home: Zur Startseite
  not_found:
    title: Seite nicht gefunden
    text: Diese Seite gibt es nicht. Vielleicht ist der Link veraltet.
  forbidden:
    title: Kein Zugriff
    text: Diese Seite ist für dich nicht freigegeben.
  csrf:
    title: Formular abgelaufen
    text: Die Seite war zu lange offen. Lade sie neu und versuche es noch einmal.
  server:
    title: Etwas ist schiefgelaufen
    text: Die Seite konnte nicht geladen werden. Versuche es gleich noch einmal. Wenn der Fehler bleibt, sag der Verwaltung Bescheid.

nav:
  label: Bereiche
  vote: Abstimmen
  admin: Verwaltung
  logout: Abmelden

role:
  board: Vorstand
  admin: Verwaltung

toast:
  signed_in: Angemeldet als {name}.
  signed_in_via: Angemeldet als {name} über {address}.
  sign_in_failed: Die Anmeldung hat nicht geklappt. Bitte versuche es noch einmal.
  ballot:
    registered: 'Stimme registriert: {choice}.'
    changed: 'Stimme geändert: {choice}.'
    unchanged: 'Bleibt bei {choice}.'
    reclaimed: 'Stimme registriert: {choice}. Die Übertragung an {name} ist aufgehoben.'
  delegation:
    choose: Bitte eine Person auswählen.
    done: Stimme an {name} übertragen.
    refused: Die Übertragung ist so nicht möglich. Die Seite zeigt jetzt den aktuellen Stand.
    revoked: Übertragung zurückgenommen. Dein Stimmrecht liegt wieder bei dir.
  poll_closed: Die Abstimmung ist bereits abgeschlossen.
  close_done: Abstimmung abgeschlossen. Das Ergebnis ist jetzt sichtbar.

home:
  greeting: Hallo {name}
  lead: Jede Abstimmung hat einen eigenen Link. Öffne die Abstimmung, um die Stimme abzugeben oder den Stand zu sehen.
  open: Offen
  open_empty: Zurzeit ist keine Abstimmung offen. Du bekommst einen Link, sobald es eine Bewerbung gibt.
  closed: Abgeschlossen
  closed_empty: '{days, plural, one {Noch keine abgeschlossene Abstimmung. Ergebnisse werden # Tag nach dem Abschluss automatisch gelöscht.} other {Noch keine abgeschlossene Abstimmung. Ergebnisse werden # Tage nach dem Abschluss automatisch gelöscht.}}'
  exception: Ausnahme
  voted: Abgestimmt
  not_voted: Noch nicht abgestimmt
  delegated: Übertragen an {name}

poll:
  back: Alle Abstimmungen
  missing: Diese Abstimmung gibt es nicht mehr oder sie ist noch nicht freigeschaltet.
  kicker:
    admission: Abstimmung über die Aufnahme von
    exception: Abstimmung über eine Ausnahme in der Probezeit von
  date:
    admission: Vorsingen am {date}
    exception: Entscheidung bis {date}
  date_open: Datum offen
  question_missing: Frage fehlt noch.
  status:
    open: Offen
    closed: Abgeschlossen

ballot:
  title: Deine Stimme
  question:
    admission: Soll {name} in den Chor aufgenommen werden?
  group: Deine Wahl
  yes: Ja
  no: Nein
  sub:
    admission_yes: aufnehmen
    admission_no: nicht aufnehmen
    exception_yes: zustimmen
    exception_no: ablehnen
  yours: Deine Stimme
  registered_yes: 'Deine Stimme ist registriert: Ja.'
  registered_no: 'Deine Stimme ist registriert: Nein.'
  registered_text: Du kannst sie ändern, solange die Abstimmung offen ist. Sie ist anonym, sichtbar ist nur, dass du abgestimmt hast.
  hint: Tippe auf Ja oder Nein. Deine Stimme wird sofort registriert und ist anonym. Sichtbar ist nur, dass du abgestimmt hast.
  delegated:
    title: Du hast deine Stimme an {name} übertragen.
    voted: '{name} hat bereits abgestimmt. Wenn du hier selbst auf Ja oder Nein tippst, kommt dein Stimmrecht sofort zu dir zurück und das Gewicht der Stimme von {name} wird angepasst.'
    not_voted: '{name} hat noch nicht abgestimmt. Wenn du hier selbst auf Ja oder Nein tippst, kommt dein Stimmrecht sofort zu dir zurück.'
    back: Wenn du hier selbst auf Ja oder Nein tippst, kommt dein Stimmrecht sofort zu dir zurück.
    revoke: Übertragung zurücknehmen, ohne abzustimmen
  weight:
    title: Du stimmst mit {weight} Stimmrechten.
    text: '{count, plural, one {{names} hat dir die Stimme übertragen.} other {{names} haben dir die Stimmen übertragen.}} Deine Entscheidung zählt {weight}-fach, solange die Übertragung besteht.'

delegation:
  toggle: Stimme an ein anderes Mitglied übertragen
  help: Wenn du keine eigene Meinung hast, kannst du deine Stimme übertragen. Sie zählt dann bei der Entscheidung dieser Person mit. Alle Mitglieder sehen, wer wem die Stimme übertragen hat.
  withdraws: Deine eigene Stimme wird dabei zurückgezogen.
  to: An wen?
  choose: Bitte auswählen
  voted: hat abgestimmt
  submit: Stimme übertragen
  cancel: Abbrechen
  limit: '{max, plural, one {Eine Person kann höchstens # Stimme zusätzlich erhalten.} other {Eine Person kann höchstens # Stimmen zusätzlich erhalten.}} Wer selbst übertragen hat, steht nicht zur Auswahl. Du kannst die Übertragung jederzeit zurücknehmen oder einfach selbst abstimmen, solange die Abstimmung offen ist.'

turnout:
  title: Beteiligung
  count: '{total, plural, one {von # Stimmrecht abgegeben} other {von # Stimmrechten abgegeben}}'
  bar: Abgegebene Stimmrechte
  summary: '{voted, plural, one {# Mitglied hat} other {# Mitglieder haben}} abgestimmt{delegated, plural, =0 {} one {, # hat die Stimme übertragen} other {, # haben die Stimme übertragen}}{missing, plural, =0 {. Alle haben mitgemacht.} one {, # fehlt noch.} other {, # fehlen noch.}}'
  missing: Noch nicht abgestimmt
  no_group: Ohne Gruppe
  names_hidden: Die Namen sehen nur Vorstand und Verwaltung.
  all_voted: Alle Mitglieder haben abgestimmt.
  delegations: Übertragene Stimmen
  pending: noch nicht abgegeben
  lock: Zwischenstände gibt es nicht. Das Ergebnis erscheint erst, wenn der Vorstand die Abstimmung abschließt.

board:
  title: Abschluss durch den Vorstand
  help: Du bist als Vorstand hinterlegt und kannst diese Abstimmung abschließen. Danach ist keine Stimmabgabe mehr möglich, und das Ergebnis erscheint für alle Mitglieder auf dieser Seite. Ein versehentlicher Abschluss lässt sich nur von der Verwaltung zurücknehmen.
  close: Abstimmung abschließen
  confirm_title: Wirklich abschließen?
  summary: '{cast} von {total} Stimmrechten sind abgegeben{missing, plural, =0 {} one {, # Mitglied fehlt noch} other {, # Mitglieder fehlen noch}}{pending, plural, =0 {} one {, # übertragene Stimme ist noch nicht abgegeben} other {, # übertragene Stimmen sind noch nicht abgegeben}}.'
  confirm: Abschließen und Ergebnis anzeigen
  cancel: Abbrechen

result:
  title: Ergebnis
  verdict:
    admission_yes: Aufgenommen
    admission_no: Nicht aufgenommen
    exception_yes: Ausnahme genehmigt
    exception_no: Ausnahme abgelehnt
  yes_share: '{percent} Ja'
  threshold: '⅔ = {needed} Ja'
  legend:
    yes: '{count} Ja · {percent}'
    no: '{count} Nein · {percent}'
    abstained: '{count} nicht abgegeben · {percent}'
  explanation: '{yes, plural, one {# von {total} Stimmberechtigten hat mit Ja gestimmt} other {# von {total} Stimmberechtigten haben mit Ja gestimmt}}, das sind {percent}. {needed, plural, one {Nötig ist mindestens # Ja-Stimme} other {Nötig sind mindestens # Ja-Stimmen}}, also zwei Drittel aller Stimmberechtigten. Nicht abgegebene Stimmen gelten als Enthaltung und zählen nicht als Ja. {cast} von {total} Stimmrechten wurden abgegeben{delegated, plural, =0 {} other {, # davon übertragen}}.'
  deletion: Diese Abstimmung wird samt Ergebnis am {date} automatisch gelöscht.

admin:
  polls:
    title: Abstimmungen
    lead: Anlegen und freischalten. Jede Abstimmung bekommt einen eigenen Link. Abgeschlossen wird vom Vorstand auf der Abstimmungsseite.

dev_login:
  kicker: Nur in der Entwicklung
  title: Konto auswählen
  lead: Diese Seite ersetzt die Google-Anmeldung, solange app.env auf dev steht. Sie meldet über dieselbe Adressprüfung an wie Google.
  private: privat
  other: Andere Adresse
  other_help: Eine Adresse, die keinem Mitglied gehört, zeigt die Fehlermeldung der Anmeldeseite.
  submit: Anmelden
  empty: Noch keine Mitglieder. bin/console seed:demo legt Beispieldaten an.

list:
  and: '{names} und {last}'
