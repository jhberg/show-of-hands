login:
  lead: Melde dich mit deinem Google-Konto an, dem {brand}-Konto oder deinem privaten, wenn es hinterlegt ist. Abstimmen kann nur, wer in der Mitgliederliste steht.
  google: Mit Google anmelden
  google_other: Mit einem anderen Konto anmelden
  return_hint: Nach der Anmeldung geht es direkt zur Abstimmung.
  dev_login: Ohne Google anmelden (Entwicklung)
