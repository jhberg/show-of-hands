app:
  title: Voting
  page_title: '{brand} Voting'

locale:
  label: Language
  de: Deutsch
  en: English

login:
  lead: 'Sign in with your Google account: your {brand} account, or your private one if it is registered. Only people on the member list can vote.'
  google: Sign in with Google
  google_other: Sign in with another account
  return_hint: After signing in, you go straight to the poll.
  dev_login: Sign in without Google (development)
  unknown:
    title: This address is not registered as a member.
    signed_in_as: Signed in as
    hint: Please sign in with your {brand} account or the private address the admins registered.
  facts:
    one_vote: One vote per member, checked by email address.
    anonymous: Your vote is anonymous and can be changed until the poll closes. Who has voted is visible.
    result: The result appears on the poll page as soon as the board closes the poll.

error:
  home: Go to the start page
  bad_request:
    title: Invalid request
    text: The form contained a value that does not exist. Reload the page and try again.
  not_found:
    title: Page not found
    text: This page does not exist. The link may be out of date.
  forbidden:
    title: No access
    text: This page is not open to you.
  csrf:
    title: Form expired
    text: The page was open for too long. Reload it and try again.
  server:
    title: Something went wrong
    text: The page could not be loaded. Try again in a moment. If the error stays, tell the admins.

nav:
  label: Sections
  vote: Vote
  admin: Admin
  logout: Sign out

role:
  board: Board
  admin: Admin

toast:
  signed_in: '{name}, you are signed in.'
  signed_in_via: Signed in as {name} with {address}.
  sign_in_failed: Sign-in did not work. Please try again.
  ballot:
    registered: 'Vote registered: {choice}.'
    changed: 'Vote changed: {choice}.'
    unchanged: 'Still {choice}.'
    reclaimed: 'Vote registered: {choice}. Your delegation to {name} has ended.'
  delegation:
    choose: Please choose a person.
    done: '{name} now holds your vote.'
    refused: The vote could not be delegated like this. The page now shows where things stand.
    revoked: Delegation taken back. Your vote is yours again.
  poll_closed: This poll is already closed.
  inactive: You are inactive for now and do not vote.
  close_done: Poll closed. The result is now visible.
  poll:
    name_missing: Please enter the name.
    question_missing: Please write the question to vote on.
    created: Draft saved. Publish it when voting should start.
    saved: Saved.
    published: Published. Members can vote now.
    deleted: Draft deleted.
    reopened: Poll reopened. All members see the notice.
    reopen_too_late: A poll can be reopened only on the day it closed.
    stale: The poll changed in the meantime. The page now shows where things stand.
    copied: Link copied.
    copy_failed: Copying did not work. Please select the link.
  member:
    invalid: A name and at least one valid email address are needed.
    same: The two addresses are the same.
    taken: 'One of these addresses is already registered: {name}.'
    own_admin: You cannot remove your own admin access.
    own_address: You cannot remove the address you are signed in with.
    added: '{name} added.'
    saved: Member saved.
    removed: '{name} removed.'
    remove_tomorrow: '{name} took part in a poll closed today. You can remove them from tomorrow.'
    remove_after_close: '{name} took part in an open poll. You can remove them from the day after it closes.'
    deactivated: '{name} is now inactive and no longer an eligible voter.'
    activated: '{name} is active again and an eligible voter.'
    deactivate_after_close: '{name} took part in an open poll. You can set them inactive once it closes.'
    deactivate_tomorrow: '{name} took part in a poll closed today. You can set them inactive from tomorrow.'
    imported: '{count, plural, =0 {No new members imported.} one {One member imported.} other {# members imported.}}'
    imported_with_problems: '{count, plural, =0 {No new members imported} one {One member imported} other {# members imported}}, {problems, plural, one {one line skipped.} other {# lines skipped.}}'
    import_missing: '{file} is no longer there.'
  settings:
    saved: Settings saved.
  group:
    added: 'Group {label} added.'
    renamed: 'Group renamed: {label}.'
    removed: Group removed.
    in_use: This group is still in use.
    missing: A key and a name are needed.
    taken: This key already exists.
    key_invalid: The key has at most 4 characters, letters A to Z or digits.

home:
  greeting: Hello {name}
  lead: Each poll has its own link. Open a poll to cast your vote or see where it stands.
  open: Open
  open_empty: No poll is open right now. You will get a link as soon as someone applies.
  closed: Closed
  closed_empty: '{days, plural, one {No closed poll yet. Results are deleted automatically # day after closing.} other {No closed poll yet. Results are deleted automatically # days after closing.}}'
  exception: Exception
  voted: Voted
  not_voted: Not voted yet
  delegated: Delegated to {name}
  inactive: Inactive

poll:
  back: All polls
  missing: This poll no longer exists or has not been published yet.
  missing_title: Poll not found
  kicker:
    admission: Vote on admitting
    exception: Vote on a probation exception for
  date:
    admission: Audition on {date}
    exception: Decision by {date}
  date_open: Date to be set
  question_missing: The question is still missing.
  status:
    draft: Draft
    open: Open
    closed: Closed
    reopened: reopened
  reopened:
    title: Reopened on {moment}.
    text: The admins took back the close. The earlier result was already visible. You can check your vote, change it, or cast it now.

ballot:
  title: Your vote
  question:
    admission: Should {name} be admitted to the choir?
  group: Your choice
  yes: 'Yes'
  no: 'No'
  sub:
    admission_yes: admit
    admission_no: do not admit
    exception_yes: approve
    exception_no: decline
  yours: Your vote
  registered_yes: 'Your vote is registered: Yes.'
  registered_no: 'Your vote is registered: No.'
  registered_text: You can change it while the poll is open. It is anonymous. Others only see that you have voted.
  hint: Tap Yes or No. Your vote is registered at once and stays anonymous. Others only see that you have voted.
  delegated:
    title: '{name} now holds your vote.'
    voted: '{name} has already voted. If you tap Yes or No here yourself, your vote comes straight back to you and the weight of {name}''s vote is adjusted.'
    not_voted: '{name} has not voted yet. If you tap Yes or No here yourself, your vote comes straight back to you.'
    back: If you tap Yes or No here yourself, your vote comes straight back to you.
    revoke: Take the delegation back without voting
  weight:
    title: You vote with {weight} voting rights.
    text: '{count, plural, one {{names} has delegated their vote to you.} other {{names} have delegated their votes to you.}} Your decision counts {weight} times while the delegation stands.'
  inactive:
    title: You are inactive for now.
    text: You are not an eligible voter, so you do not vote. The admins can set you active again.

delegation:
  toggle: Delegate your vote to another member
  help: If you have no opinion of your own, you can delegate your vote. It then counts with this person's decision. All members see who delegated their vote to whom.
  withdraws: Your own vote is withdrawn.
  to: To whom?
  choose: Please choose
  voted: has voted
  submit: Delegate vote
  cancel: Cancel
  limit: '{max, plural, one {A person can receive at most # extra vote.} other {A person can receive at most # extra votes.}} Members who delegated their own vote are not listed. You can take the delegation back at any time, or simply vote yourself, while the poll is open.'

turnout:
  title: Turnout
  count: '{total, plural, one {of # voting right cast} other {of # voting rights cast}}'
  bar: Voting rights cast
  summary: '{voted, plural, one {# member has} other {# members have}} voted{delegated, plural, =0 {} one {, # has delegated} other {, # have delegated}}{missing, plural, =0 {. Everyone took part.} one {, # is still missing.} other {, # are still missing.}}'
  missing: Not voted yet
  no_group: No group
  names_hidden: Only the board and the admins see the names.
  all_voted: All members have voted.
  delegations: Delegated votes
  pending: not cast yet
  lock: There are no interim results. The result appears only once the board closes the poll.

board:
  title: Closing by the board
  help: You are on the board, so you can close this poll. After that, nobody can vote any more, and the result appears on this page for all members. Only the admins can undo a close made by mistake.
  close: Close the poll
  confirm_title: Close it now?
  summary: '{cast} of {total} voting rights are cast{missing, plural, =0 {} one {, # member is still missing} other {, # members are still missing}}{pending, plural, =0 {} one {, # delegated vote is not cast yet} other {, # delegated votes are not cast yet}}.'
  confirm: Close and show the result
  cancel: Cancel

result:
  title: Result
  verdict:
    admission_yes: Admitted
    admission_no: Not admitted
    exception_yes: Exception approved
    exception_no: Exception declined
  yes_share: '{base, select, cast {{percent} of votes yes} other {{percent} yes}}'
  threshold: '{share, select, half {> ½} two_thirds {⅔} other {¾}} = {needed} yes'
  rule: '{share, select, half {more than half} two_thirds {two thirds} other {three quarters}} {base, select, cast {of the votes cast} other {of all eligible voters}}'
  legend:
    yes: '{count} yes · {percent}'
    no: '{count} no · {percent}'
    abstained: '{count} not cast · {percent}'
  explanation: '{base, select, cast {{yes} of {cast} votes cast were yes} other {{yes} of {total} eligible voters voted yes}}, that is {percent}. {needed, plural, one {At least # yes vote is needed} other {At least # yes votes are needed}}, {rule}. {base, select, cast {Votes not cast do not count.} other {Votes not cast count as abstentions, not as yes.}} {cast} of {total} voting rights were cast{delegated, plural, =0 {} other {, # of them delegated}}.'
  deletion: This poll and its result will be deleted automatically on {date}.
  reopened: '{count, plural, one {The poll was reopened once in between.} other {The poll was reopened # times in between.}}'

admin:
  members:
    title: Members
    lead: This list is also the access list. Only the addresses registered here can sign in.
    add: Add member
    count:
      eligible: '{count, plural, one {eligible voter} other {eligible voters}}'
      board: on the board
      admin: with admin access
      inactive: inactive
    search_label: Search members
    search_placeholder: Search by name or email
    you: you
    edit: Edit
    remove: Remove
    remove_question: 'Remove {name}?'
    remove_text: They will no longer be able to sign in.
    remove_confirm: Yes, remove
    cancel: Cancel
    no_match: No matches.
    inactive: inactive
    display_name: 'Display name: {name}'
    deactivate: Set inactive
    activate: Set active
    import:
      title: Import members from a file
      missing: 'You can also import members from a file. Put {file} into the config folder, next to config.php. The template members.example.csv shows the columns.'
      never: '{file} is ready and has not been imported yet.'
      last: '{file} was last imported on {moment}.'
      open: Import the file again
      question: '{count, plural, one {Import one new member?} other {Import # new members?}}'
      text: Members already on the list stay as they are. Anyone removed since the last import who is still in the file comes back.
      nothing_new: The file holds no new members.
      existing: '{count, plural, one {One entry is already on the list and stays as it is.} other {# entries are already on the list and stay as they are.}}'
      problems: '{count, plural, one {This line is skipped:} other {These # lines are skipped:}}'
      confirm: Yes, import
      line: 'Line {line}: {issue}'
      issue:
        header_invalid: The first line must name the columns, at least name and email.
        name_missing: The name is missing.
        address_missing: The email address is missing.
        first_address_invalid: The email address is not valid.
        second_address_invalid: The second email address is not valid.
        same_addresses: The two addresses are the same.
        address_repeated: 'The address {value} is already in a line above.'
        group_unknown: 'There is no voice group "{value}".'
        flag_invalid: '"{value}" is neither yes nor no. Enter x for yes, or leave it empty.'
    form:
      edit_title: Edit member
      name: Name
      name_placeholder: First and last name
      display_name: Display name (optional)
      display_name_placeholder: e.g. Anna M.
      display_name_help: Shown in name lists instead of the full name. Left empty, the lists show the full name.
      email: Email address ({brand} account)
      email_placeholder: 'first.last@{domain}'
      email2: Another email address (optional)
      email2_placeholder: private Google account
      email_help: Both addresses lead to the same person and the same vote. Each address must match the Google account exactly.
      group: Voice group
      board: Board
      board_help: Can close polls on the poll page and always sees who has not voted yet.
      admin: Admin access
      admin_help: Can create, publish, and reopen polls, and maintain members, roles, and voice groups.
      submit_add: Add
      submit_edit: Save
  polls:
    title: Polls
    lead: Create and publish. Each poll gets its own link. The board closes it on the poll page.
    new: New poll
    details: Details
    empty: No polls yet.
    deletion: Deleted on {date}
    turnout: Voting rights cast
    missing: '{days, plural, one {Poll not found. Closed polls are deleted automatically after # day.} other {Poll not found. Closed polls are deleted automatically after # days.}}'
    kind:
      admission: Admission
      exception: Probation exception
    draft:
      help: Members cannot see this poll yet. Once it is published, they can vote right away, even before the audition.
      publish: Publish poll
      edit: Edit
      delete: Delete
      delete_question: Really delete this draft?
      delete_text: This cannot be undone.
      delete_confirm: Yes, delete
    open:
      title: Open since {moment}
      help: Members can vote and change their vote until the poll closes. The board closes it, not here but right on the poll page. Only then is the result visible.
      help_board: Members can vote and change their vote until the poll closes. The board closes it, not here but right on the poll page ({names}). Only then is the result visible.
      reopened: This poll was reopened on {moment}.
      edit: Edit note
      lock_label: 'Result:'
      lock: calculated only after the close. The admins see no interim counts either, so the running poll influences nobody.
    closed:
      title: Closed on {moment}
      help: The result is on the poll page and visible to all members. The number of eligible voters ({eligible}) was recorded at the close.
      deletion: The poll and its result will be deleted automatically on {date}.
      reopen: Reopen
      reopen_today: A poll closed by mistake can be reopened only today, on the day it closed.
      reopen_over: Reopening was possible only on the day the poll closed. The result has been final since.
      reopen_question: Really reopen?
      reopen_text: The result was already visible to everyone. Once reopened, members can change their vote or cast it late, and everyone sees a notice on the poll page that the poll was reopened. Meant only for a poll closed by mistake.
      reopen_confirm: Yes, reopen
    to_poll: Go to the poll page
    cancel: Cancel
    share:
      label: Link for the members
      copy: Copy
      help: The link leads straight to this poll. With several polls on the same evening, each has its own link.
    form:
      new_title: New poll
      edit_title: Edit poll
      back: Back
      kind: Kind of poll
      admission: Admission to the choir
      admission_help: After the audition. The question is always “Should … be admitted to the choir?”
      exception: Probation exception
      exception_help: A concert or a rehearsal weekend before admission. You write the question, the answer is Yes or No.
      name_admission: Name of the applicant
      name_exception: Name of the person on probation
      name_placeholder: First and last name
      question: Question to vote on
      question_placeholder: May Leon sing bass at the concert on 18 October, although his probation is still running?
      group: Voice group
      date_admission: Audition date
      date_exception: Decision by
      note: Note for the members (optional)
      note_placeholder_admission: 'For example: Nora auditions at the rehearsal on 8 September. The poll stays open until the discussion and the vote after the audition.'
      note_placeholder_exception: 'For example: Leon has been on probation for three weeks. The bass section is two people short for the concert.'
      fixed: Kind, name, question, and voice group are fixed since voting opened.
      help_new: The poll is saved as a draft. Members see it only once it is published.
      help_draft: Members see the poll only once it is published.
      help_open: Changes are visible to everyone at once.
      submit_new: Save as draft
      submit_edit: Save
  settings:
    title: Settings
    majority:
      legend: Majority
      before: A poll needs yes votes from
      share:
        half: more than half
        two_thirds: two thirds
        three_quarters: three quarters
      base_label: What the majority counts from
      base:
        eligible: of all eligible voters
        cast: of the votes cast
      example: '{base, select, cast {With {eligible, plural, one {# vote cast} other {# votes cast}}} other {With {eligible, plural, one {# member} other {# members}}}}, {needed, plural, one {# yes vote is} other {# yes votes are}} needed.'
      abstention: '{base, select, cast {Whoever does not vote does not count.} other {Whoever does not vote counts as an abstention, not as yes.}}'
      text: The rule applies to admissions and to probation exceptions. A change applies to polls created afterwards.
    delegation:
      legend: Vote delegation
      enabled: Members may hand their vote to another member
      help: Delegations are visible to everyone and cannot be passed on. Whoever votes themselves takes their vote back automatically.
      max_before: One person can receive at most
      max_after: 'extra votes, so up to {weight} voting rights.'
    visibility:
      legend: Visibility
      show_open_names: All members see who has not voted yet
      help: Otherwise members only see the number. The board and admins always see the names.
    retention:
      legend: Retention
      before: Closed polls are deleted automatically, with their result,
      after: days after closing.
      help: After that, neither the result nor the turnout nor the name of the person voted on remains. Drafts and open polls stay.
    save: Save
    groups:
      title: Voice groups
      lead: This order sorts the member list and the “Not voted yet” view. The key is fixed, the name can be changed.
      label_of: Name of group {key}
      up: move up
      down: move down
      remove: Remove
      in_use: Still in use
      key_placeholder: Key
      key_label: Key of the new group
      label_placeholder: Name of the group, for example Soprano 3
      label_label: Name of the new group
      add: Add
      help: Groups that members or polls still use cannot be removed. Name changes take effect at once.
    sign_in:
      title: Sign-in
      domain: Google Workspace domain
      client_id: OAuth client ID
      help: Can only be changed in config.php. It is created once in the Google Cloud Console. Private Google accounts work when the address is registered for the member.

dev_login:
  kicker: Development only
  title: Choose an account
  lead: This page replaces the Google sign-in while app.env is dev. It signs in through the same address check as Google.
  private: private
  other: Other address
  other_help: An address that belongs to no member shows the login page's error.
  submit: Sign in
  empty: No members yet. bin/console seed:demo adds sample data.

list:
  and: '{names} and {last}'

format:
  moment: '{moment}'
